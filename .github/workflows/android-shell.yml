name: Build Android Shell APK

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: '要加载的自托管站点地址 (https://...)'
        required: true
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create project folder
        run: mkdir -p android-shell && cd android-shell

      - name: Generate settings.gradle
        run: |
          cat > android-shell/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "VirtualPhoneShell"
          include ':app'
          EOF

      - name: Generate root build.gradle
        run: |
          cat > android-shell/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.0' apply false
          }
          EOF

      - name: Generate app build.gradle
        run: |
          cat > android-shell/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace "com.virtualphone.shell"
              compileSdk 34
              defaultConfig {
                  applicationId "com.virtualphone.shell"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              kotlinOptions {
                  jvmTarget = '1.8'
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF

      - name: Generate AndroidManifest.xml（相册权限+刘海挖孔）
        run: |
          cat > android-shell/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="virtual-phone"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">
                  <activity android:name=".MainActivity"
                      android:exported="true"
                      android:layoutInDisplayCutoutMode="shortEdges">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Generate styles.xml（透明状态栏）
        run: |
          mkdir -p android-shell/app/src/main/res/values
          cat > android-shell/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:windowDrawsSystemBarBackgrounds">true</item>
              </style>
          </resources>
          EOF

      - name: Generate MainActivity.kt（边到边全屏）
        run: |
          mkdir -p android-shell/app/src/main/java/com/virtualphone/shell
          cat > android-shell/app/src/main/java/com/virtualphone/shell/MainActivity.kt <<'EOF'
          package com.virtualphone.shell
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          import android.webkit.WebView
          import android.webkit.WebViewClient
          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.setDecorFitsSystemWindows(false)
                  val webView = WebView(this)
                  webView.settings.javaScriptEnabled = true
                  webView.settings.domStorageEnabled = true
                  webView.settings.allowFileAccess = true
                  webView.settings.allowContentAccess = true
                  webView.webViewClient = WebViewClient()
                  setContentView(webView)
                  val siteUrl = "${{ github.event.inputs.site_url }}"
                  webView.loadUrl(siteUrl)
              }
          }
          EOF

      - name: Generate launcher icon resource
        run: |
          mkdir -p android-shell/app/src/main/res/mipmap
          echo "icon" > android-shell/app/src/main/res/mipmap/ic_launcher

      - name: Build APK
        working-directory: android-shell
        run: ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android-shell/app/build/outputs/apk/release/app-release.apk
